- name: SSH - keys only, no root, no passwords
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-forgeops.conf
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      MaxAuthTries 3
      LoginGraceTime 30
      X11Forwarding no
      AllowUsers {{ admin_user }}
    validate: sshd -t -f %s
  notify: Restart ssh

- name: Firewall - deny incoming by default
  community.general.ufw:
    default: deny
    direction: incoming

- name: Firewall - allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Firewall - open only SSH, HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "22", proto: tcp }
    - { port: "80", proto: tcp }
    - { port: "443", proto: tcp }
    - { port: "443", proto: udp }

- name: Firewall - enable
  community.general.ufw:
    state: enabled

- name: fail2ban - protect SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      findtime = 10m
      bantime = 1h
  notify: Restart fail2ban

- name: Automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Services are running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [fail2ban, unattended-upgrades]
