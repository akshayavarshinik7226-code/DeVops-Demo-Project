# Copy to inventory.ini (ignored by Git) and put your server's IP.
# First run uses the provider's initial user (often root or ubuntu); after that, use deploy.
[forgeops]
forgeops-prod ansible_host=203.0.113.10 ansible_user=ubuntu

[forgeops:vars]
admin_user=deploy
# public key that may log in as admin_user (your laptop's key)
admin_pubkey_file=~/.ssh/id_ed25519.pub
# public key the GitHub deploy workflow uses
deploy_pubkey_file=~/.ssh/forgeops_deploy.pub
