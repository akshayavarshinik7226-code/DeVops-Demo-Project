<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="ForgeOps payroll and people console" />
    <meta name="theme-color" content="#0B6B52" />
    <title>ForgeOps</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="shell">
      <aside class="rail" aria-label="Main">
        <a class="brand" href="#/">
          <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
            <rect x="3" y="5" width="26" height="8" rx="2" fill="currentColor" />
            <rect x="3" y="19" width="26" height="8" rx="2" fill="currentColor" opacity=".45" />
            <circle cx="8" cy="9" r="1.6" fill="var(--surface)" />
            <circle cx="8" cy="23" r="1.6" fill="var(--surface)" />
          </svg>
          <span>ForgeOps</span>
        </a>
        <nav>
          <a href="#/" data-route="overview">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z" /></svg>
            <span>Overview</span>
          </a>
          <a href="#/people" data-route="people">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.8a3.4 3.4 0 0 1 0 6.4M18 14.8c1.8.7 3 2.4 3.5 5.2" /></svg>
            <span>People</span>
          </a>
          <a href="#/payroll" data-route="payroll">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 10h18M7 15h4" /></svg>
            <span>Payroll</span>
          </a>
          <a href="#/system" data-route="system">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4" /></svg>
            <span>System</span>
            <i class="dot" id="nav-health" aria-hidden="true"></i>
          </a>
        </nav>
        <div class="rail-foot">
          <button class="theme" id="theme" type="button" aria-label="Switch colour theme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" /></svg>
            <span>Theme</span>
          </button>
        </div>
      </aside>

      <div class="body">
        <header class="top">
          <h1 id="page-title">Overview</h1>
          <div class="build" id="build" title="Running version">
            <span class="env" id="env">…</span>
            <span id="ver"></span>
          </div>
        </header>
        <main id="main" tabindex="-1"></main>
      </div>
    </div>

    <div class="drawer-back" id="drawer-back" hidden></div>
    <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title" role="dialog"></aside>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
